name: Release Desktop macOS ARM64

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.3)"
        required: true

concurrency:
  group: release-desktop-mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop-app:
    # macos-14 arm64 runner 经常容量不足排队被取消；macos-15 同为 arm64，拥堵较少
    runs-on: macos-15
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # docx/doc/pptx 等办公格式默认走 DocReader gRPC 服务，桌面版没有该服务会解析失败；
      # 链接 anydoc 进程内引擎（-tags anydoc）后自动接管这些格式，无需外部服务。
      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustc --version

      - name: Build anydoc static library
        run: ./scripts/build-anydoc-lib.sh

      # 复用项目自带打包脚本：构建前端 → 同步 web/ → wails build → 组装 .app（含 Resources/config/migrations/web）
      - name: Build & package .app (project script)
        shell: bash
        run: |
          export GONOSUMDB="git.sr.ht/*"
          export GOPROXY="https://proxy.golang.org,direct"
          # 前端 vite 构建内存占用超过 Node 默认堆上限（4G），在 CI 上会 OOM Abort 6
          export NODE_OPTIONS="--max-old-space-size=8192"
          export WAILS_TAGS="sqlite_fts5,anydoc"
          bash ./scripts/package-mac-app.sh

      # gojieba 在包级 init()（先于 main 的 godotenv.Load）从编译机绝对路径加载词典，
      # 产物拷到别的机器必 panic 闪退。把词典打进 Resources，并用 Info.plist
      # LSEnvironment 让 LaunchServices 双击启动时注入 JIEBA_DICT_DIR。
      - name: Bundle jieba dictionaries
        run: |
          APP="dist/WeKnora Lite.app"
          DICT_SRC="$(go env GOMODCACHE)/github.com/yanyiwu/gojieba@v1.4.7/deps/cppjieba/dict"
          ls "${DICT_SRC}"
          mkdir -p "${APP}/Contents/Resources/jieba"
          cp "${DICT_SRC}/jieba.dict.utf8" "${DICT_SRC}/hmm_model.utf8" \
             "${DICT_SRC}/user.dict.utf8" "${DICT_SRC}/idf.utf8" \
             "${DICT_SRC}/stop_words.utf8" "${APP}/Contents/Resources/jieba/"

          # LSEnvironment 无法表达"app 自身路径"，词典定位已改由 Go 代码
          # （internal/types/evaluation.go newJieba）按可执行文件相对路径解析。
          # 这里重新签名使词典资源进入 adhoc 签名。
          plutil -lint "${APP}/Contents/Info.plist"

          # 重新签名使修改后的 Info.plist 生效（原 adhoc 签名会因资源变动失效）
          codesign --force --deep --sign - "${APP}"

      - name: Create DMG
        run: |
          DMG_NAME="WeKnora-Lite-App_${{ steps.ver.outputs.version }}_macOS_arm64"
          DMG_SRC="dmg_staging"
          mkdir -p "${DMG_SRC}"
          cp -R "dist/WeKnora Lite.app" "${DMG_SRC}/"
          ln -s /Applications "${DMG_SRC}/Applications"

          hdiutil create -volname "WeKnora Lite" \
            -srcfolder "${DMG_SRC}" \
            -ov -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" > "${DMG_NAME}.dmg.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          path: WeKnora-Lite-App_*
          retention-days: 3

  release:
    needs: [build-desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}-macos-arm64" \
            --title "WeKnora Lite ${{ steps.ver.outputs.version }} (macOS arm64)" \
            --notes "WeKnora Lite 桌面应用 macOS arm64 (Apple Silicon) 构建产物。双击 dmg 拖入 Applications 即可运行。" \
            WeKnora-Lite-App_* || true
